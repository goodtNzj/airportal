services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airportal-node
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TRUST_PROXY=true
      - DATABASE_URL=file:/app/packages/server/prisma/data/airportal.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
      - web-dist:/web-dist
      - ./data:/app/packages/server/prisma/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: airportal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - web-dist:/web-dist:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/99-wait-for-dist.sh:ro
    depends_on:
      node:
        condition: service_healthy

volumes:
  uploads:
  web-dist:
