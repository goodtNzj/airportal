user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ---- Real client IP resolution ----
    # When deployed behind a cloud tunnel (Cloudflare Tunnel / frp / etc.),
    # nginx sees the tunnel egress as $remote_addr, so per-IP rate limits
    # collapse all users into one bucket and trigger 502/503 for everyone
    # after the first. Trust X-Forwarded-For from the loopback/docker/private
    # networks to recover the true client IP for $remote_addr, access_log,
    # and limit_req_zone.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # ---- Upstream ----
    upstream node_app {
        server node:3000;
    }


    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/xhtml+xml
        application/font-woff2;

    # ========================
    # Server: HTTP (port 80)
    # ========================
    server {
        listen 80;
        server_name _;

        # ---- Security Headers ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ---- Web built assets (versioned by contenthash) ----
        location /assets/ {
            root   /web-dist;
            try_files $uri =404;

            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;

            # Extra headers for cached assets
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---- Other static files (favicon, icons, etc.) ----
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            root   /web-dist;
            try_files $uri =404;

            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ---- index.html — never cache (exact match) ----
        location = /index.html {
            root   /web-dist;
            try_files /index.html =404;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # ---- SPA fallback (frontend pages) ----
        location / {
            root   /web-dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # ---- API proxy (general) ----
        location ~ ^/api/(?!transfers|p2p/ws) {

            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ---- Upload endpoint (stricter rate limit + larger body) ----
        location /api/transfers {
            client_max_body_size 50m;

            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        # ---- P2P WebSocket proxy ----
        location /api/p2p/ws {
            proxy_pass http://node_app;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Client identity
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived connection
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
        }

        # ---- Health check (pass-through to node) ----
        location /health {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
